name: release package

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  linux-x86_64-gnu:
    timeout-minutes: 540
    runs-on: [self-hosted, Linux, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test release
        run: sh ci/x86_64-linux-release.sh
      - name: Package FFI distribution
        run: tar -C build-release -czf zig-ffi-x86_64-linux-gnu.tar.gz stage4-ffi
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-linux-gnu
          path: zig-ffi-x86_64-linux-gnu.tar.gz
          if-no-files-found: error

  windows-x86_64-gnu:
    timeout-minutes: 420
    runs-on: [self-hosted, Windows, x86_64]
    env:
      ARCH: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test release
        shell: powershell
        run: ci/x86_64-windows-release.ps1
      - name: Package FFI distribution
        shell: powershell
        run: Compress-Archive -Path build-release/stage4-ffi -DestinationPath zig-ffi-x86_64-windows-gnu.zip -Force
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-windows-gnu
          path: zig-ffi-x86_64-windows-gnu.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64-gnu, windows-x86_64-gnu]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*
