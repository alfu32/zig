name: ci
on:
  workflow_dispatch:
concurrency:
  # Cancels duplicate manual runs for the same ref and actor.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true
permissions:
  # Sets permission policy for `GITHUB_TOKEN`
  contents: read
jobs:
  x86_64-linux-debug:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision QEMU and Wasmtime
        run: sh ci/provision-linux-test-deps.sh
      - name: Build and Test
        run: sh ci/x86_64-linux-debug.sh
  x86_64-linux-debug-llvm:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision QEMU and Wasmtime
        run: sh ci/provision-linux-test-deps.sh
      - name: Build and Test
        run: sh ci/x86_64-linux-debug-llvm.sh
  x86_64-linux-release:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision QEMU and Wasmtime
        run: sh ci/provision-linux-test-deps.sh
      - name: Build and Test
        run: sh ci/x86_64-linux-release.sh
      - name: Package FFI distribution
        run: tar -C build-release -czf zig-ffi-x86_64-linux-gnu.tar.gz stage4-ffi
      - name: Upload FFI package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-linux-gnu
          path: zig-ffi-x86_64-linux-gnu.tar.gz
          if-no-files-found: error
  aarch64-linux-debug:
    timeout-minutes: 360
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: sh ci/aarch64-linux-debug.sh
  aarch64-linux-release:
    timeout-minutes: 360
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: sh ci/aarch64-linux-release.sh
  x86_64-macos-release:
    runs-on: macos-15-intel
    env:
      ARCH: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: ci/x86_64-macos-release.sh
  aarch64-macos-debug:
    runs-on: macos-14
    env:
      ARCH: "aarch64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: ci/aarch64-macos-debug.sh
  aarch64-macos-release:
    runs-on: macos-14
    env:
      ARCH: "aarch64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: ci/aarch64-macos-release.sh
  x86_64-windows-debug:
    timeout-minutes: 360
    runs-on: windows-2022
    env:
      ARCH: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: ci/x86_64-windows-debug.ps1
  x86_64-windows-release:
    timeout-minutes: 360
    runs-on: windows-2022
    env:
      ARCH: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: ci/x86_64-windows-release.ps1
      - name: Package FFI distribution
        shell: powershell
        run: Compress-Archive -Path build-release/stage4-ffi -DestinationPath zig-ffi-x86_64-windows-gnu.zip -Force
      - name: Upload FFI package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-windows-gnu
          path: zig-ffi-x86_64-windows-gnu.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [x86_64-linux-release, x86_64-windows-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download FFI packages
        uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*
