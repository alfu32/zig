name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64-gnu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build FFI distribution
        run: sh ci/build-ffi-linux.sh
      - name: Smoke test exported entry point
        run: python3 ci/smoke-test-ffi.py
      - name: Package FFI distribution
        run: tar -C dist -czf zig-ffi-x86_64-linux-gnu.tar.gz .
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-linux-gnu
          path: zig-ffi-x86_64-linux-gnu.tar.gz
          if-no-files-found: error

  windows-x86_64-gnu:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build FFI distribution
        shell: powershell
        run: ci/build-ffi-windows.ps1
      - name: Smoke test exported entry point
        shell: powershell
        run: python ci/smoke-test-ffi.py
      - name: Package FFI distribution
        shell: powershell
        run: Compress-Archive -Path dist/* -DestinationPath zig-ffi-x86_64-windows-gnu.zip -Force
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zig-ffi-x86_64-windows-gnu
          path: zig-ffi-x86_64-windows-gnu.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64-gnu, windows-x86_64-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: packages/**/*
